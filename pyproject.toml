[project]
name = "omniforge-ai-studio"
version = "0.7.0"
description = "Universal multi-agent AI platform: orchestrator, 120 agent roles, durable runs, review loop, delegation, MCP, automation, billing, plugins."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.5",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
# PostgreSQL mirror + the embedded server used to test it
postgres = ["psycopg[binary]>=3.1", "pgserver>=0.1"]
# encrypted secrets vault
vault = ["cryptography>=42"]

[project.scripts]
omniforge = "omniforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["omniforge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
